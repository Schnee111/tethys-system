name: Deploy TETHYS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Storage/Projects/tethys
            git pull origin main
            cd frontend && npm ci && npm run build && cd ..
            sudo docker compose -f docker-compose.prod.yml up -d --build
            sudo rsync -av --delete ~/Storage/Projects/tethys/frontend/dist/ /var/www/tethys/
            # Prune old build artifacts to prevent disk exhaustion
            sudo docker image prune -f --filter "dangling=true" 2>/dev/null || true
            sudo docker builder prune -a -f --filter "until=24h" 2>/dev/null || true
